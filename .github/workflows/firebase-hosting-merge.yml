name: Deploy to Firebase Hosting on push
on:
  push:
    branches:
      - main
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm ci && npm run build
      
      # 1. Authenticate using the official Google Auth step
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PTPROJECTSWEB }}
          
      # 2. Deploy to Firebase using the CLI directly
      - name: Deploy to Firebase Hosting
        run: npx firebase-tools deploy --only hosting --project ptprojectsweb