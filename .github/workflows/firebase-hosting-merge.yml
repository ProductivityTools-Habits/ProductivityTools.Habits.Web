name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Service Account Email
        run: |
          echo "The service account email is:"
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT_PTPROJECTSWEB }}' | jq -r '.client_email' | sed 's/./& /g'
      - uses: actions/checkout@v4
      - run: npm ci && npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PTPROJECTSWEB }}
          channelId: live
          projectId: ptprojectsweb
